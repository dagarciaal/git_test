<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Signup Form</title>
      <link rel="stylesheet" href="style.css">
      <link rel="stylesheet" href="./fonts/Norse.otf"/>

  </head>
  <body>
    <div class="container">
      <div class="left-side">
        <img id="back-img"
          src="https://images.unsplash.com/photo-1585202900225-6d3ac20a6962?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
          alt="leaves image"/>
        <div id="logo-container">
          <img id="logo-img"
            src="https://raw.githubusercontent.com/TheOdinProject/curriculum/5f37d43908ef92499e95a9b90fc3cc291a95014c/html_css/project-sign-up-form/odin-lined.png"
            alt="odin image" />
          <span id="logo-name"><strong>ODIN</strong></span>
        </div> 
      </div>
      <div class="rigth-side">
        <div class="text-form">
          <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams.</p>
          <p>Sign up now to get started.</p>
          <p>You know you want to.</p>
        </div>
        <div class="form-div">
          <form>
          <div>Let´s do this</div>
          <div class="form-item">
            <label for="first-name">FIRST NAME</label>
            <input
                  type="text"
                  id="first-name"
                  name="first-name"
                  required
                />
          </div>
          <div class="form-item">
            <label for="last-name">LAST NAME</label>
            <input
                  type="text"
                  id="last-name"
                  name="last-name"
                  required
                />
          </div>
          <div class="form-item">
            <label for="email">EMAIL</label>
            <input
                  type="text"
                  id="email"
                  name="email"
                  required
                />
          </div>
          <div class="form-item">
            <label for="phone">PHONE NUMBER</label>
            <input
                  type="number"
                  id="phone"
                  name="phone"
                  required
                />
          </div>
          <div class="form-item">
            <label for="password">PASSWORD</label>
            <input
                  type="password"
                  id="password"
                  name="password"
                  required
                />
          </div>
          <div class="form-item">
            <label for="confirm-password">CONFIRM PASSWORD</label>
            <input
                  type="password"
                  id="confirm-password"
                  name="confirm-password"
                  required
                />
          </div>
          <button>CREATE ACCOUNT</button>
          </form>
        </div>
        
      </div>
    </div>
    


  </body>



</html>
